services:
  phone-performance-monitor:
    image: ghcr.io/clouduh/phone-performance-monitor:latest
    pull_policy: always
    container_name: phone-performance-monitor
    restart: unless-stopped
    ports:
      - "18090:8080"
    volumes:
      - phone-performance-monitor-data:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  phone-performance-monitor-data:
    name: phone-performance-monitor-data
